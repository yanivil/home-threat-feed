name: Re-verify stale indicators

on:
  schedule:
    - cron: "17 3 1 * *"  # 1st of every month, 03:17 UTC
  workflow_dispatch:
    inputs:
      max_age:
        description: "--max-age override: re-verify rows of every type checked this many days ago or more (empty = per-type defaults, 0 = every row)"
        default: ""

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 15 s per stale row; the free key allows 500 lookups a day
    steps:
      # Pinned to a commit, not a tag, so a moved tag cannot change what runs here and the
      # repository's Actions settings can require SHA pinning. Bump the SHA and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Re-verify stale rows on VirusTotal
        id: recheck
        # A quota stop exits 1 but leaves refreshed rows worth committing.
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          MAX_AGE: ${{ inputs.max_age }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::VT_API_KEY secret is not set; add it under Settings > Secrets and variables > Actions"
            exit 0
          fi
          python3 vt_check.py --recheck ${MAX_AGE:+--max-age "$MAX_AGE"}

      # A feed that fails fails the job here, before anything is committed.
      - name: Lint the feed
        run: python3 feed_lint.py spark-ioc-feed.csv

      - name: Commit the updated feed
        run: |
          if git diff --quiet -- spark-ioc-feed.csv; then
            echo "Feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Re-verify stale indicators on VirusTotal" -- spark-ioc-feed.csv
          git push

      - name: Fail the job if the re-check stopped early
        if: steps.recheck.outcome == 'failure'
        run: |
          echo "::error::The re-check stopped early (quota or API error); rows done so far were committed. Re-run tomorrow to continue."
          exit 1
